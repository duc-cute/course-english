<p class="font-body-md text-on-surface-variant mb-6">Choose a strong password to secure your learning progress.</p>
<form class="space-y-6" id="reset-form">
<!-- New Password -->
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-1.5 border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all font-body-md" id="new-password" placeholder="Min. 8 characters" required="" type="password"/>
</div>
<!-- Password Strength Meter -->
<div class="mt-3 space-y-2">
<div class="flex justify-between items-center px-1">
<span class="text-[11px] font-label-sm text-outline uppercase tracking-wider" id="strength-label">Strength: Weak</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="strength-meter-bar h-full w-[20%] bg-error rounded-full" id="strength-bar"></div>
</div>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">verified_user</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-1.5 border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all font-body-md" id="confirm-password" placeholder="Repeat your password" required="" type="password"/>

</div>

<button class="w-full py-4 bg-primary text-on-primary font-headline-md rounded-xl shadow-xl hover:bg-secondary transition-colors" onclick="location.reload()">
        Continue to Login

<script>
    // Password Strength Logic
    const pwdInput = document.getElementById('new-password');
    const strengthBar = document.getElementById('strength-bar');
    const strengthLabel = document.getElementById('strength-label');
    const resetForm = document.getElementById('reset-form');
    const successOverlay = document.getElementById('success-overlay');

    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      let score = 0;
      if (val.length > 5) score++;
      if (val.length > 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { width: '20%', color: 'bg-error', text: 'Strength: Very Weak' },
        { width: '40%', color: 'bg-error-container', text: 'Strength: Weak' },
        { width: '60%', color: 'bg-tertiary-container', text: 'Strength: Moderate' },
        { width: '80%', color: 'bg-secondary-container', text: 'Strength: Strong' },
        { width: '100%', color: 'bg-primary', text: 'Strength: Secure' }
      ];

      const level = levels[Math.min(score, 4)];
      strengthBar.className = `strength-meter-bar h-full rounded-full ${level.color}`;
      strengthBar.style.width = level.width;
      strengthLabel.textContent = level.text;
    });

    // Form Submission Handling
    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
      btn.disabled = true;

      // Simulate API call
      setTimeout(() => {
        successOverlay.classList.remove('hidden');
        successOverlay.classList.add('flex');
        window.scrollTo(0,0);
      }, 1500);
    });
  </script>
