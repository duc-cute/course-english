<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #eef2ff 0%, #faf8ff 100%);
            width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }

        .input-focus-ring:focus {
            outline: none;
            border-color: #004ac6;
            box-shadow: 0 0 0 3px rgba(0, 74, 198, 0.1);
        }

        .floating-blob {
            position: absolute;
            z-index: -1;
            filter: blur(60px);
            opacity: 0.4;
            border-radius: 9999px;
            animation: move 20s infinite alternate linear;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(30px, 50px); }
        }
    </style>
</head>
<body class="bg-background text-on-surface relative pb-xl">
<!-- Decorative Elements -->
<div class="floating-blob w-64 h-64 bg-primary-container top-[-50px] right-[-100px]"></div>
<div class="floating-blob w-48 h-48 bg-secondary-container bottom-[20%] left-[-80px]" style="animation-delay: -5s;"></div>
<!-- Main Content -->
<main class="px-margin-mobile flex flex-col items-center pt-xl">
<!-- Header Branding & Mascot -->
<header class="flex flex-col items-center text-center mb-lg w-full">
<div class="w-32 h-32 mb-sm flex items-center justify-center">
<!-- Mascot Image -->
<img class="w-full h-full object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_9kf5HilFP5SQB7Lguj4kKrAmbD5bCVXUgNFBPQL5v-CAdvDvTIeDYQZs9RXjpIsVjW4x6VzePDA5mRfDzxigxdvOYL8a1H93AaTHCE8suIzc4fCTGVW3fHgmXAG7Ji_axo35XGea5WFZKA6nVbZ_6457Qtk-Gv1ofwEGJWD33SoJPedhH8eWnPUr_zarDIMr1efKA1OFJK7nfNdtt14VMMtR-k6JDPQzGTChmAgmsodEqCdvfdzwkYQRErkjrPYxhxXkq9hx0nx0"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">
                Learn English Smarter
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Start your journey to mastery.
            </p>
</header>
<!-- Login Section -->
<section class="w-full glass-card rounded-xl p-md flex flex-col gap-md">
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface ml-base">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all duration-200" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-base">
<label class="font-label-md text-label-md text-on-surface">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Sign In -->
<button class="w-full h-12 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-xl shadow-lg active:scale-95 transition-all duration-200 mt-xs" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-sm py-xs">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<!-- Social Sign In -->
<button class="w-full h-12 bg-white border border-outline-variant text-on-surface font-label-md text-label-md rounded-xl flex items-center justify-center gap-sm active:scale-95 transition-all duration-200">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</section>
<!-- Create Account Footer -->
<footer class="mt-lg text-center flex flex-col gap-xs">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to Lumina English?
            </p>
<a class="font-label-md text-label-md text-primary font-bold hover:opacity-80 transition-opacity" href="#">
                Create Account
            </a>
</footer>
</main>
<!-- Floating Atmosphere Elements -->
<div class="fixed bottom-margin-mobile left-margin-mobile opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-primary text-[48px]">school</span>
</div>
<div class="fixed top-margin-mobile right-margin-mobile opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-secondary text-[64px]">translate</span>
</div>
<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
