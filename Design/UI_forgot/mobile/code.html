<!-- Forgot Password Card -->
<main class="w-full max-w-[calc(100%-32px)] sm:max-w-md mx-auto mb-10 fade-in" style="animation-delay: 0.2s;">
<div class="bg-surface-container-lowest premium-card-shadow rounded-[16px] p-8 border border-outline-variant/30">
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">lock_reset</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Forgot Password</h2>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface border-[1.5px] border-outline-variant rounded-xl focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all font-body-md text-body-md outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full h-[56px] premium-gradient text-on-primary font-label-md text-label-md rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform" type="submit">
          Send Reset Link
          <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<a class="inline-flex items-center gap-2 font-label-md text-label-md text-secondary hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
          Back to Login
        </a>
</div>
</div>
</main>

<!-- Light Atmospheric Effects Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Subtle mouse movement parallax for the card
      const card = document.querySelector('main');
      window.addEventListener('mousemove', (e) => {
        if (window.innerWidth > 640) {
          const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
          const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
          card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }
      });

      // Simple form submission feedback
      const form = document.querySelector('form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const button = form.querySelector('button');
        const originalText = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Sending...';
        
        setTimeout(() => {
          button.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Link Sent!';
          button.classList.replace('premium-gradient', 'bg-green-600');
        }, 1500);
      });
    });
  </script>
