<style>
    body { font-family: 'Lexend', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
    .btn-3d-primary {

      border-bottom: 6px solid #003d85;
      transition: all 0.1s ease;
    }

    }
    .btn-3d-secondary {
      position: relative;
      background-color: #ffffff;
      border: 2px solid #c2c6d6;
      border-bottom: 6px solid #c2c6d6;
      transition: all 0.1s ease;

    .card-3d {
      background-color: #ffffff;
      border: 2px solid #e1e3e4;

    }
    .reward-chip {
      transform: rotate(-5deg);
      box-shadow: 0 4px 0px rgba(130, 81, 0, 0.3);
    }
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    /* Animation Keyframes */
    @keyframes fadeUpStagger {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rewardPop {
      0% { transform: scale(0) rotate(-5deg); opacity: 0; }
      100% { transform: scale(1) rotate(-5deg); opacity: 1; }
    }

    @keyframes ambientFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pulseFocus {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* Animation Classes */
    .animate-fade-up {
      animation: fadeUpStagger 0.6s ease-out forwards;
      opacity: 0;
    }

    .animate-reward-pop {
      animation: rewardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    .animate-float {
      animation: ambientFloat 3s ease-in-out infinite;
    }

    .animate-pulse-cta {
      animation: pulseFocus 2s ease-in-out infinite;
    }

    /* Accessibility: Respect Prefe-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .animate-fade-up, .animate-reward-pop, .animate-float, .animate-pulse-cta, .confetti, .animate-bounce {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

<script>
    function createConfetti() {
      // Respect user preference for reduced motion
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const colors = ['#0058be', '#6cf8bb', '#ffddb8', '#ba1a1a', '#006c49'];
      const container = document.body;
      
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        
        const size = Math.random() * 8 + 6;
        confetti.style.width = size + 'px';
        confetti.style.height = size + 'px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-20px';
        confetti.style.borderRadius = i % 2 === 0 ? '50%' : '2px';
        
        const duration = Math.random() * 3 + 2;
        const delay = Math.random() * 2;
        
        confetti.style.animation = `confettiFall ${duration}s linear forwards`;
        confetti.style.animationDelay = delay + 's';
        
        container.appendChild(confetti);
        
        // Cleanup DOM
        setTimeout(() => {
          confetti.remove();
        }, (duration + delay) * 1000);
      }
    }

    window.onload = () => {
      createConfetti();
      // Repeating burst every 6 seconds for ongoing celebration feel
      setInterval(createConfetti, 6000);
    };
  </script>
