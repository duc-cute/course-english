<script>
        function confettiEffect() {
            // Simulated micro-interaction logic
            const colors = ['#2d4bd7', '#7b24dc', '#296800', '#ff9800'];
            for(let i = 0; i < 20; i++) {
                const confetto = document.createElement('div');
                confetto.style.position = 'fixed';
                confetto.style.width = '10px';
                confetto.style.height = '10px';
                confetto.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetto.style.left = (window.innerWidth / 2) + 'px';
                confetto.style.top = (window.innerHeight / 2) + 'px';
                confetto.style.borderRadius = '2px';
                confetto.style.zIndex = '1000';
                confetto.style.pointerEvents = 'none';
                document.body.appendChild(confetto);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 10;
                
                let currentX = window.innerWidth / 2;
                let currentY = window.innerHeight / 2;
                let opacity = 1;

                const animate = () => {
                    currentX += vx;
                    currentY += vy;
                    opacity -= 0.02;
                    confetto.style.left = currentX + 'px';
                    confetto.style.top = currentY + 'px';
                    confetto.style.opacity = opacity;

                    if(opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        confetto.remove();
                    }
                };
                requestAnimationFrame(animate);
            }
            
            // Visual feedback on progress
            const progressBar = document.querySelector('.bg-tertiary-container');
            if (progressBar) {
                progressBar.style.width = '60%';
            }
        }
