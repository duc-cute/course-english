            CONTINUE
        </button>
</div>
<script>
        const tiles = document.querySelectorAll('.tile');
        const slots = document.querySelectorAll('.slot');
        const checkBtn = document.getElementById('check-btn');
        const feedbackTray = document.getElementById('feedback-tray');
        let currentWord = ['', '', '', '', ''];
        const correctWord = 'APPLE';

        // Simulation of drag and drop for a high-end feel
        tiles.forEach(tile => {
            tile.addEventListener('click', () => {
                const letter = tile.getAttribute('data-letter');
                const emptySlotIndex = currentWord.findIndex(l => l === '');
                
                if (emptySlotIndex !== -1 && !tile.classList.contains('used')) {
                    tile.classList.add('opacity-0', 'pointer-events-none', 'used');
                    currentWord[emptySlotIndex] = letter;
                    const slot = slots[emptySlotIndex];
                    slot.textContent = letter;
                    slot.classList.replace('bg-surface-container-high', 'bg-primary-fixed');
                    slot.classList.replace('border-outline-variant', 'border-primary');
                    
                    // Add a tiny bounce
                    slot.animate([
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.1)' },
                        { transform: 'scale(1)' }
                    ], { duration: 200 });
                }
            });
        });

        slots.forEach((slot, index) => {
            slot.addEventListener('click', () => {
                if (currentWord[index] !== '') {
                    const letter = currentWord[index];
                    const originalTile = Array.from(tiles).find(t => t.getAttribute('data-letter') === letter && t.classList.contains('used'));
                    
                    if (originalTile) {
                        originalTile.classList.remove('opacity-0', 'pointer-events-none', 'used');
                        currentWord[index] = '';
                        slot.textContent = '';
                        slot.classList.replace('bg-primary-fixed', 'bg-surface-container-high');
                        slot.classList.replace('border-primary', 'border-outline-variant');
                    }
                }
            });
        });

        checkBtn.addEventListener('click', () => {
            const result = currentWord.join('');
            if (result === correctWord) {
                // Correct path
                checkBtn.textContent = 'AWESOME!';
                feedbackTray.classList.remove('translate-y-full');
                
                // Celebration animation on slots
                slots.forEach((s, i) => {
                    setTimeout(() => {
                        s.classList.add('correct-animation');
                    }, i * 100);
                });
            } else {
                // Wrong path - simple shake
                document.getElementById('drop-zone').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
                
                checkBtn.classList.replace('bg-primary', 'bg-error');
                checkBtn.textContent = 'TRY AGAIN';
                setTimeout(() => {
                    checkBtn.classList.replace('bg-error', 'bg-primary');
                    checkBtn.textContent = 'CHECK';
                }, 1000);
            }
        });

        // Initialize empty states
        checkBtn.disabled = false; // Enabled for the demo
    </script>
