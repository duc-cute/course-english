<style>

<script>
        // Micro-interaction: Confetti Effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#4b66f1', '#7b24dc', '#87fe45', '#ffdad6', '#2d4bd7'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                const size = Math.random() * 8 + 4;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                
                const duration = Math.random() * 3 + 2;
                confetti.style.animationDuration = `${duration}s`;
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                
                container.appendChild(confetti);
                
                // Remove after animation finishes
                setTimeout(() => {
                    confetti.remove();
                }, (duration + 2) * 1000);
            }
        }

        // Trigger confetti on load
        window.onload = () => {
            createConfetti();
            // Optional: Repeat occasionally for more celebration
            setInterval(createConfetti, 4000);
        };

        // Button Ripple/Interactive feel logic
        const btn = document.querySelector('button');
        btn.addEventListener('click', () => {
            btn.innerHTML = 'Loading Next...';
            setTimeout(() => {
                location.reload(); // Simulate going to next lesson
            }, 1200);
        });
    </script>
