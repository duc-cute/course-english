# Load .env from project root (same folder as gradlew). optional = no error if file missing.
spring.config.import=optional:file:.env[.properties]

spring.application.name=course-english-api

# config database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_english?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

# config port
server.port=7070

# config jwt
duccute.jwt.base64-secret=${JWT_SECRET:Y291cnNlZW5nbGlzaGp3dHNlY3JldGtleTEyMzQ1Njc4OTA=}
duccute.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY:3600}
duccute.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY:86400}

# config pagination
spring.data.web.pageable.one-indexed-parameters=true

# storage config
storage.location=${STORAGE_LOCATION:C:/DucNguyen/course-english-storage}
storage.max-file-size=${STORAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${storage.max-file-size}
spring.servlet.multipart.max-request-size=${storage.max-file-size}

upload-file.base-uri=${UPLOAD_FILE_BASE_URI:file:///C:/DucNguyen/course-english-storage/}

# external integrations (dictionary, future TTS/AIâ¦)
integration.dictionary.free-dictionary.enabled=${DICTIONARY_API_ENABLED:true}
integration.dictionary.free-dictionary.base-url=${DICTIONARY_API_BASE_URL:https://api.dictionaryapi.dev}
integration.dictionary.free-dictionary.connect-timeout-ms=${DICTIONARY_API_CONNECT_TIMEOUT_MS:3000}
integration.dictionary.free-dictionary.read-timeout-ms=${DICTIONARY_API_READ_TIMEOUT_MS:8000}

# mail (Phase 1.5 â lesson publish email)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Course English <ducnguyen1501@gmail.com>}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.api-base-url=${API_PUBLIC_BASE_URL:http://localhost:7070}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.thymeleaf.check-template-location=true

# Redis cache (Phase 3 — lesson detail; default off for local dev without Docker Redis)
app.redis.enabled=${REDIS_ENABLED:false}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.key-prefix=${REDIS_KEY_PREFIX:ce:}
app.redis.lesson-detail-ttl-seconds=${REDIS_LESSON_DETAIL_TTL_SECONDS:43200}
app.redis.null-cache-ttl-seconds=${REDIS_NULL_CACHE_TTL_SECONDS:120}
app.redis.lock-ttl-seconds=${REDIS_LOCK_TTL_SECONDS:10}
app.redis.ttl-jitter-ratio=${REDIS_TTL_JITTER_RATIO:0.2}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management.health.redis.enabled=${REDIS_ENABLED:false}
