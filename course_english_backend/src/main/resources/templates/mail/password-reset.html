<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Đặt lại mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h2 style="margin-top: 0;">Đặt lại mật khẩu</h2>
  <p>Xin chào <strong th:text="${recipientName}">bạn</strong>,</p>
  <p>Bạn (hoặc ai đó) vừa yêu cầu đặt lại mật khẩu cho tài khoản <span th:text="${brandName}">MT English</span>.</p>
  <p>
    <a th:href="${resetUrl}"
       style="display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600;">
      Đặt mật khẩu mới
    </a>
  </p>
  <p style="font-size: 14px; color: #6b7280;">
    Liên kết hết hạn sau <span th:text="${ttlMinutes}">30</span> phút.
    Nếu bạn không yêu cầu, hãy bỏ qua email này.
  </p>
  <p style="font-size: 12px; color: #9ca3af; word-break: break-all;" th:text="${resetUrl}"></p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
  <p style="font-size: 12px; color: #9ca3af;">© <span th:text="${currentYear}">2026</span> <span th:text="${brandName}">MT English</span></p>
</body>
</html>
