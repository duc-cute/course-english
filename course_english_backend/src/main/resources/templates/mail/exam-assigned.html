<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title th:text="'Đề thi mới: ' + ${examTitle}">Đề thi mới</title>
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap');
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .stack-pad { padding-left: 20px !important; padding-right: 20px !important; }
      .hero-title { font-size: 24px !important; line-height: 1.3 !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f8f9ff;font-family:'Nunito Sans',Segoe UI,Helvetica,Arial,sans-serif;color:#0b1c30;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    <span th:text="|${actorName} vừa gán đề ${examTitle}. Làm bài ngay.|">Giáo viên vừa gán đề thi mới.</span>
  </div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8f9ff;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" class="email-container" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">

          <tr>
            <td class="stack-pad" style="padding:8px 0 24px;">
              <span style="font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;font-size:22px;font-weight:700;color:#2151da;" th:text="${brandName}">MT English</span>
            </td>
          </tr>

          <tr>
            <td style="background-color:#ffffff;border-radius:24px;border:1px solid #c4c5d7;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.05);">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="stack-pad" style="padding:40px 40px 24px;background:linear-gradient(180deg,#eff4ff 0%,#ffffff 100%);text-align:center;">
                    <h1 class="hero-title" style="margin:0 0 12px;font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;font-size:28px;line-height:1.3;font-weight:700;color:#0b1c30;">
                      Có đề thi mới!
                    </h1>
                    <p style="margin:0;font-family:'Nunito Sans',Segoe UI,sans-serif;font-size:18px;line-height:1.6;color:#434655;">
                      Xin chào <strong th:text="${studentName}" style="color:#0b1c30;">bạn</strong>,
                      giáo viên vừa gán đề thi cho lớp của bạn.
                    </p>
                  </td>
                </tr>

                <tr>
                  <td class="stack-pad" style="padding:0 40px 32px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #c4c5d7;border-radius:16px;">
                      <tr>
                        <td style="padding:24px;">
                          <p th:if="${classroomName != null and !#strings.isEmpty(classroomName)}" style="margin:0 0 12px;">
                            <span style="display:inline-block;background-color:#6cf8bb;color:#00714d;font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;font-size:14px;font-weight:600;padding:6px 12px;border-radius:9999px;" th:text="${classroomName}">Lớp 10A1</span>
                          </p>
                          <h2 style="margin:0 0 12px;font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;font-size:24px;line-height:1.4;font-weight:700;color:#0b1c30;" th:text="${examTitle}">
                            Midterm Test
                          </h2>
                          <p th:if="${windowLabel != null and !#strings.isEmpty(windowLabel)}" style="margin:0 0 16px;font-size:15px;color:#434655;" th:text="${windowLabel}">
                            Mở ngay
                          </p>
                          <p style="margin:0;font-size:16px;color:#434655;">
                            <strong th:text="${actorName}" style="color:#0b1c30;">Giáo viên</strong>
                            vừa gán đề thi này cho lớp của bạn.
                          </p>
                        </td>
                      </tr>
                    </table>

                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:32px;">
                      <tr>
                        <td align="center">
                          <a th:href="${examUrl}" target="_blank" style="display:inline-block;padding:16px 40px;font-family:'Plus Jakarta Sans',Segoe UI,sans-serif;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:9999px;background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);">
                            Làm bài ngay →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:24px 8px 0;font-size:13px;color:#8b8fa3;">
              © <span th:text="${currentYear}">2026</span>
              <span th:text="${brandName}">MT English</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
