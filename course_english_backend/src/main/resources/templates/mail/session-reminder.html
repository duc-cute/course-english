<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Nhắc buổi dạy</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h2 style="margin-top: 0;" th:text="${startingSoon} ? 'Buổi dạy sắp bắt đầu' : 'Buổi dạy sau khoảng 15 phút'">Nhắc buổi dạy</h2>
  <p>Xin chào <strong th:text="${teacherName}">thầy/cô</strong>,</p>
  <p>Bạn có buổi dạy trên Course English:</p>
  <ul style="padding-left: 20px;">
    <li><strong>Lớp:</strong> <span th:text="${classroomName}">Class 10A1</span></li>
    <li><strong>Buổi:</strong> <span th:text="${sessionTitle}">Creative Writing</span></li>
    <li th:if="${lessonTitle != null and !lessonTitle.isEmpty()}">
      <strong>Bài:</strong> <span th:text="${lessonTitle}">Unit 3</span>
    </li>
    <li><strong>Ngày:</strong> <span th:text="${dateLabel}">Thứ Tư, 21/6/2026</span></li>
    <li><strong>Giờ:</strong> <span th:text="${timeRange}">19:00 – 19:50</span></li>
    <li th:if="${meetLink != null and !meetLink.isEmpty()}">
      <strong>Meet:</strong>
      <a th:href="${meetLink}" th:text="${meetLink}">https://meet.google.com/...</a>
    </li>
  </ul>
  <p>
    <a th:href="${scheduleUrl}"
       style="display: inline-block; background: #004ac6; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600;">
      Xem lịch dạy
    </a>
  </p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
  <p style="font-size: 12px; color: #9ca3af;">© <span th:text="${currentYear}">2026</span> Course English</p>
</body>
</html>
